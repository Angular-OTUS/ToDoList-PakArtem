@let taskData = task();
@let isCompleted = taskData.status === 'Completed';
@let statusActionText = isCompleted ? 'Вернуть в работу' : 'Завершить задачу';

<div class="task-status">
  <input
    #statusCheckbox
    class="cursor-pointer"
    type="checkbox"
    [appTooltip]="statusActionText"
    [checked]="isCompleted"
    (change)="onStatusChange(statusCheckbox.checked)"
  />

  {{ statusActionText }}
</div>

<hr />

<div class="description-text">
  {{ taskData.description }}
</div>
