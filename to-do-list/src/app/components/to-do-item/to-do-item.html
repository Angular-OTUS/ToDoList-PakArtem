@if (isEdit()) {
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <input class="title-input" matInput [(ngModel)]="inputValue" />
  </mat-form-field>
  <button
    app-button
    appTooltip="Изменить задачу"
    type="button"
    class="btn"
    variant="add"
    [disabled]="isInputEmpty()"
    (click)="onClick()"
  >
    Save
  </button>
} @else {
  @let isCompleted = status() === 'Completed';

  <input
    #statusCheckbox
    class="cursor-pointer"
    type="checkbox"
    [checked]="isCompleted"
    [appTooltip]="isCompleted ? 'Вернуть в работу' : 'Завершить задачу'"
    (click)="$event.stopPropagation()"
    (dblclick)="$event.stopPropagation()"
    (change)="onStatusChange(statusCheckbox.checked)"
  />
  {{ text() }}
  <button
    app-button
    appTooltip="Удалить задачу"
    type="button"
    class="btn"
    variant="delete"
    (click)="deleteTask($event)"
  >
    Delete
  </button>
}
