<app-to-do-header></app-to-do-header>

<mat-form-field class="status-filter">
  <mat-label>Status</mat-label>
  <mat-select [(ngModel)]="selectedStatus">
    @for (status of statuses; track status) {
      <mat-option [value]="status.value">{{ status.viewValue }}</mat-option>
    }
  </mat-select>
</mat-form-field>

@if (isLoading()) {
  <div class="spinner-wrapper">
    <app-to-do-spinner [size]="60" />
  </div>
} @else {
  <div class="list-wrapper">
    <ul class="list">
      @for (task of filteredTasks(); track task.id) {
        <li
          appToDoItem
          tabindex="0"
          appTooltip="Показать описание"
          [isSelected]="selectedItemId() === task.id"
          [id]="task.id"
          [text]="task.text"
          [status]="task.status"
          (delete)="deleteTask(task.id)"
          (statusChange)="changeStatus(task.id, $event)"
          (keydown.enter)="todoService.selectItem(task.id)"
          (keydown.space)="todoService.selectItem(task.id)"
          (click)="todoService.selectItem(task.id)"
        ></li>
      }
    </ul>
    <div class="description">
      {{ selectedDescriptionTask() }}
    </div>
  </div>
}

<app-to-do-create-item></app-to-do-create-item>
