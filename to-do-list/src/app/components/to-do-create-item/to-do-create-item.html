<form #todoForm="ngForm" class="form" (ngSubmit)="addTask()">
  <div class="form-fields">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <input
        class="title-input"
        name="title"
        matInput
        placeholder="Add your new todo"
        i18n-placeholder="@@addTodoPlaceholder"
        [(ngModel)]="model.title"
        required
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <textarea
        class="description-input"
        name="description"
        matInput
        placeholder="Description"
        i18n-placeholder="@@descriptionPlaceholder"
        subscriptSizing="dynamic"
        cdkTextareaAutosize
        #autosize="cdkTextareaAutosize"
        [(ngModel)]="model.description"
      ></textarea>
    </mat-form-field>
  </div>

  <button
    app-button
    appTooltip="Add Task"
    i18n-appTooltip="@@addTaskTooltip"
    i18n="@@addTask"
    type="submit"
    class="btn"
    variant="add"
    [disabled]="todoForm.invalid"
  >
    Add task
  </button>
</form>
