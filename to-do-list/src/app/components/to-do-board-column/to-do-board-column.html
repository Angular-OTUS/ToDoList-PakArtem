@let taskList = tasks();

<h3 class="task-status">{{ getStatusLabel(status()) }} ({{ taskList.length }})</h3>

<ul
  class="task-list"
  cdkDropList
  [cdkDropListData]="taskList"
  [id]="status()"
  (cdkDropListDropped)="taskDrop.emit($event)"
  [class.empty]="taskList.length === 0"
>
  @for (task of taskList; track task.id) {
    <li class="task-item" cdkDrag [cdkDragData]="task" tabindex="0" [id]="task.id">
      {{ task.text }}
    </li>
  }
</ul>
